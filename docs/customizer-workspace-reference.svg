<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" fill="none">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" stroke="#D9DDE3" stroke-width="1" opacity=".52"/>
    </pattern>
    <linearGradient id="customAccent" x1="1300" y1="266" x2="1336" y2="290" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F04F55"/><stop offset=".28" stop-color="#E6B33C"/><stop offset=".52" stop-color="#45A96E"/><stop offset=".76" stop-color="#4384D6"/><stop offset="1" stop-color="#9863CE"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#273244" flood-opacity=".10"/>
    </filter>
    <style>
      text { font-family: Lexend, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #1D1D1F; }
      .muted { fill: #6E6E73; }
      .quiet { fill: #8C8C91; }
      .tiny { font-size: 11px; }
      .small { font-size: 13px; }
      .medium { font-size: 14px; }
      .section { font-size: 12px; font-weight: 650; letter-spacing: .15px; }
    </style>
  </defs>

